# Tier A synthetic map generator - THE dataset for Steps 4-8.
seed: 20260806

detector:
  gain_e_per_adu: 2.4        # electrons per ADU
  read_noise_e: 4.0          # RMS electrons per readout
  dark_rate_e_per_s: 0.02
  well_depth_e: 100000
  dispersion_cm1_per_px: 0.55
  n_channels: 1024

acquisition:
  reference_integration_s: 5.0   # long "ground truth" exposure T
  target_integration_s: [0.1, 0.25, 0.5, 1.0]   # short exposures t to thin down to
  accumulations: 1

map:
  shape: [64, 64]            # start small; scale to 128x128 once Step 6 passes
  material: silicon
  peak_photons_per_s: 4000   # default signal rate at reference conditions

materials:
  silicon:            # in-distribution
    peaks: [{center: 520.7, fwhm: 3.5, rel_amplitude: 1.0}]
  amorphous_silicon:  # OOD-A: broad band, breaks the linewidth prior
    peaks: [{center: 480.0, fwhm: 70.0, rel_amplitude: 1.0}]
  sic_4h:             # OOD-B: multiple modes, single-Lorentzian is structurally wrong
    peaks: [{center: 776.0, fwhm: 4.0, rel_amplitude: 0.6},
            {center: 796.0, fwhm: 4.0, rel_amplitude: 1.0}]
  gan:                # OOD-C: band far from the nominal window anchor
    peaks: [{center: 567.0, fwhm: 5.0, rel_amplitude: 1.0}]
  si_doublet:         # OOD-D: THE HARD CASE
    peaks: [{center: 519.7, fwhm: 3.5, rel_amplitude: 1.0},
            {center: 521.7, fwhm: 3.5, rel_amplitude: 0.8}]
  si_broad:           # Sweep material: same peak position, slightly wider
    peaks: [{center: 520.7, fwhm: 4.5, rel_amplitude: 1.0}]

stress_field:
  kind: smooth_gradient      # smooth_gradient | grain | radial
  shift_range_cm1: [-1.2, 0.8]

defects:
  count: [3, 8]
  radius_px: [1, 3]
  difficulty_crlb: [0.3, 12.0]          # log-uniform, THE parameter
  difficulty_reference_exposure_s: 0.25
  fwhm_scale: [1.0, 1.0]

background:
  fluorescence_slope: [0.0, 400.0]   # photons/s across the window
  cosmic_ray_rate_per_spectrum: 0.002
